<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Is He/She OK?</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ff;color:#303257;font-family:'Comic Sans MS','Chalkboard SE',ui-rounded,system-ui,sans-serif;background-image:radial-gradient(circle at 5% 20%,#d9eeff 0,transparent 35%),radial-gradient(circle at 95% 85%,#ffe5ef 0,transparent 35%);min-height:100vh}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}button:focus-visible{outline:4px solid #f9b935;outline-offset:4px}button:disabled{cursor:default}.app{max-width:1220px;margin:auto;padding:20px}header{display:grid;grid-template-columns:190px 1fr 190px;gap:18px;align-items:start}.score{background:white;border:3px solid #82b8ed;border-radius:23px;padding:12px;text-align:center;box-shadow:0 6px 0 #dae7f6}.score.purple{border-color:#b79af0;box-shadow:0 6px 0 #e7defa}.score strong{font-size:22px}.stars{color:#edaa21;font-size:30px;letter-spacing:5px}.role{font-size:14px;color:#636482}.middle{text-align:center}h1{font-size:clamp(26px,4vw,48px);margin:4px 0 8px}h2{margin:5px 0;font-size:clamp(22px,3vw,36px)}p{margin:8px 0}.tag{font-size:18px;color:#676485}.hearts{font-size:32px;letter-spacing:8px;min-height:44px}.answers{font-size:clamp(17px,2vw,23px)}.tools{display:flex;justify-content:center;gap:10px;margin:18px 0}.tools button{background:#fff;border-radius:20px;padding:10px 18px;min-height:48px;color:#515371}.choose{display:flex;justify-content:center;gap:30px;margin:20px auto}.card{background:white;border:3px solid #e4e3f2;border-radius:24px;box-shadow:0 6px 0 #e0dfee;overflow:hidden;transition:transform .15s,border-color .15s;padding:10px;color:#303257}.card:not(:disabled):hover{transform:translateY(-3px);border-color:#a797eb}.card:active{transform:scale(.97)}.character{width:260px}.character img{height:300px}.card img{width:100%;object-fit:contain;display:block}.label{display:block;font-size:22px;font-weight:bold;padding:7px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px auto;max-width:1000px}.grid .card img{height:195px}.guess-layout{display:grid;grid-template-columns:29% 1fr;gap:22px;align-items:center;margin-top:15px}.guess-layout .grid{margin:0;gap:12px}.guess-layout .card img{height:145px}.mystery{height:390px;position:relative;background:white;border:3px dashed #b4a5ec;border-radius:30px;overflow:hidden;display:flex;justify-content:center;align-items:center}.body-img{height:350px;width:100%;object-fit:contain;clip-path:inset(43% 0 0 0)}.cover{position:absolute;top:13px;left:5%;width:90%;height:170px;border-radius:24px;background:linear-gradient(135deg,#ded5ff,#c5e8ff);display:flex;align-items:center;justify-content:center;font-size:85px;font-weight:bold;color:#7b67c9}.revealed{height:100%;width:100%;object-fit:contain}.bad{opacity:.42;filter:grayscale(.8);border-color:#f6a5ae}.good{border-color:#70ca9a;background:#effff5;animation:pop .35s}.feedback{min-height:65px;text-align:center;margin:15px 0;font-size:23px;font-weight:bold}.primary{padding:14px 28px;background:#7962d8;color:white;border-radius:20px;min-height:54px;font-weight:bold;font-size:22px;box-shadow:0 5px 0 #5947a6}.center{text-align:center}.overlay{position:fixed;inset:0;background:#f3f0ff;z-index:10;display:grid;place-items:center;padding:22px}.dialog{text-align:center;background:#fff;border:3px solid #d5c9f8;box-shadow:0 12px 40px #58468920;border-radius:32px;padding:35px;max-width:550px;width:100%}.dialog h2{font-size:36px}.big{font-size:78px}.confetti{position:fixed;top:-30px;animation:fall 2.4s ease-in forwards;pointer-events:none;z-index:20}.fallback{font-size:45px;display:block;padding:35px 5px}.hint{text-align:center;color:#77738c;font-size:14px;margin:18px}.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pop{50%{transform:scale(1.06)}}@keyframes fall{to{transform:translateY(110vh) rotate(400deg)}}@media(max-width:800px){.app{padding:12px}header{grid-template-columns:125px 1fr 125px;gap:8px}.score strong{font-size:18px}.score{padding:8px}.stars{font-size:24px;letter-spacing:1px}.guess-layout{grid-template-columns:25% 1fr;gap:10px}.guess-layout .grid{grid-template-columns:repeat(3,minmax(0,1fr))}.guess-layout .card img{height:105px}.mystery{height:315px}.body-img{height:290px}.cover{height:145px}.grid .card img{height:150px}.label{font-size:18px}.card{padding:6px;border-radius:17px}}@media(max-width:540px){header{grid-template-columns:1fr 1fr}.middle{grid-column:1/-1;grid-row:2}.choose{gap:12px}.character{width:48%}.character img{height:225px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.guess-layout{grid-template-columns:1fr}.mystery{height:220px;width:180px;margin:auto}.body-img{height:205px}.cover{height:105px;top:0;font-size:60px}.guess-layout .grid{grid-template-columns:repeat(3,minmax(0,1fr))}.guess-layout .card img{height:100px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.confetti{display:none}}
</style></head><body><main class="app"><header id="header"></header><nav class="tools"><button id="sound">🔊 Sound on</button><button id="restart">↻ Restart</button></nav><section id="screen"></section><p class="hint">Ask aloud • Tap a feeling • First to 3 points wins</p></main><div id="modal"></div>
<script>
const ASSETS={"boyBody": {"angry": "https://i.postimg.cc/NfsjP4Hr/Angry-cartoon-boy-standing-upright.png", "happy": "https://i.postimg.cc/44M9DjXM/Smiling-cartoon-boy-standing-straight.png", "sad": "https://i.postimg.cc/T2qP9Spg/Tearful-cartoon-boy-in-colorful-clothes.png", "tired": "https://i.postimg.cc/jqQjX9Lw/Sleepy-Cartoon-Boy-Yawning.png", "full": "https://i.postimg.cc/5Ns2cCBm/Satisfied-boy-with-an-empty-dinner-plate.png", "hungry": "https://i.postimg.cc/2jF5wJV1/Hungry-boy-with-a-hamburger-thought-bubble.png", "thirsty": "https://i.postimg.cc/XNcv8hp5/Thirsty-cartoon-boy-with-water-bubble.png"}, "girlBody": {"angry": "https://i.postimg.cc/s27z2QWC/Angry-standing-cartoon-girl.png", "happy": "https://i.postimg.cc/rFrrMgpN/Cheerful-Girl-in-Lavender-Dress.png", "sad": "https://i.postimg.cc/9QvVVtrL/Sad-cartoon-girl-with-tears.png", "tired": "https://i.postimg.cc/6p7wD15d/Sleepy-cartoon-girl-in-lavender-dress.png", "full": "https://i.postimg.cc/cLKZV54t/Full-and-satisfied-after-dinner.png", "hungry": "https://i.postimg.cc/RZ39jbVn/Hungry-girl-with-a-hamburger-thought-bubble.png", "thirsty": "https://i.postimg.cc/XYZ3TD7C/Thirsty-girl-with-water-thought-bubble.png"}, "boyFace": {"angry": "https://i.postimg.cc/SRKHcJnS/Angry-3D-cartoon-boy-head.png", "happy": "https://i.postimg.cc/J0hSjGsj/Happy-cartoon-boy-head-isolated.png", "sad": "https://i.postimg.cc/hvGNVfXG/Sad-cartoon-boy-with-tears.png", "tired": "https://i.postimg.cc/3Nwz2dkK/Sleepy-yawning-cartoon-boy.png", "full": "https://i.postimg.cc/J0hSjGsR/Satisfied-boy-with-empty-plate-thought-bubble.png", "hungry": "https://i.postimg.cc/VvN2XdJn/Hungry-boy-head-with-hamburger-bubble.png", "thirsty": "https://i.postimg.cc/mkrK7tPh/Thirsty-boy-and-water-thought-bubble.png"}, "girlFace": {"angry": "https://i.postimg.cc/sx8HSKFt/Angry-cartoon-girl-with-pink-bow.png", "happy": "https://i.postimg.cc/8c3XWw82/Happy-Cartoon-Girl-Head-with-Pink-Bow.png", "sad": "https://i.postimg.cc/44FSr4KS/Tearful-girl-with-a-pink-bow.png", "tired": "https://i.postimg.cc/wMP4JFKn/Sleepy-girl-with-pink-bow.png", "full": "https://i.postimg.cc/KcsHdcKs/Satisfied-girl-and-empty-plate-thought-bubble.png", "hungry": "https://i.postimg.cc/7hct7X8r/Hungry-girl-with-hamburger-thought-bubble-(1).png", "thirsty": "https://i.postimg.cc/HWPhfWJN/Thirsty-girl-with-water-thought-bubble-(1).png"}},WORDS=['angry','happy','sad','tired','full','hungry','thirsty'];
const KEY='is-he-she-ok-v2';let state={scores:[0,0],picker:0,page:1,character:null,secret:null,guesses:[],hearts:3,done:false,last:null},sound=true,ctx=null,busy=false;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.state&&saved.state.scores?.length===2&&[1,2,3].includes(saved.state.page)){state=saved.state;sound=saved.sound!==false}}catch(e){}
const $=id=>document.getElementById(id),guesser=()=>1-state.picker,pronoun=()=>state.character==='boy'?'he':'she';
function save(){try{localStorage.setItem(KEY,JSON.stringify({state,sound}))}catch(e){}}
function tone(kind){if(!sound)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const notes={tap:[440],wrong:[240,180],correct:[523,659,784],win:[523,659,784,1047]}[kind]||[440];notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.12;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.2)})}catch(e){}}
function image(src,alt,cls=''){return `<img class="${cls}" src="${src}" alt="${alt}">`}
function scores(i){return `<div class="score ${i?'purple':''}"><strong>Student ${i+1} · ${state.scores[i]}</strong><div class="stars" aria-label="${state.scores[i]} of 3 points">${'★'.repeat(state.scores[i])+'☆'.repeat(3-state.scores[i])}</div><div class="role">${state.picker===i?'Secret picker':'Guesser'}</div></div>`}
function render(){save();$('sound').textContent=sound?'🔊 Sound on':'🔇 Sound off';const p=pronoun();$('header').innerHTML=scores(0)+`<div class="middle">${state.page===3?`<h2>Is ${p} <span id="question">${state.last||'______'}</span>?</h2><div class="answers">Yes, ${p} is.<br>No, ${p} isn’t.</div><div class="hearts" aria-label="${state.hearts} hearts remaining">${'❤️'.repeat(state.hearts)+'🤍'.repeat(3-state.hearts)}</div>`:'<h1>Is He/She OK?</h1><p class="tag">A secret feeling adventure</p>'}</div>`+scores(1);
if(state.page===1){$('screen').innerHTML=`<div class="center"><h2>Student ${state.picker+1}: Pick a character!</h2></div><div class="choose">${['boy','girl'].map(c=>`<button class="card character" data-character="${c}">${image(ASSETS[c+'Body'].happy,c)}<span class="label">${c==='boy'?'Boy':'Girl'}</span></button>`).join('')}</div>`;document.querySelectorAll('[data-character]').forEach(b=>b.onclick=()=>{tone('tap');state.character=b.dataset.character;state.page=2;render()})}
if(state.page===2){$('screen').innerHTML=`<div class="center"><h2>Student ${state.picker+1}: Pick a secret feeling!</h2><p>Student ${guesser()+1}: Look away!</p></div><div class="grid">${WORDS.map(w=>`<button class="card" data-secret="${w}">${image(ASSETS[state.character+'Body'][w],state.character+' '+w)}<span class="label">${w}</span></button>`).join('')}</div>`;document.querySelectorAll('[data-secret]').forEach(b=>b.onclick=()=>{tone('tap');state.secret=b.dataset.secret;state.hearts=3;state.guesses=[];state.done=false;state.last=null;handoff()})}
if(state.page===3){$('screen').innerHTML=`<div class="center"><p class="tag">Student ${guesser()+1}: Ask and tap!</p></div><div class="guess-layout"><div class="mystery">${state.done?image(ASSETS[state.character+'Body'][state.secret],state.character+' '+state.secret,'revealed'):image(ASSETS[state.character+'Body'].happy,state.character,'body-img')+'<div class="cover" aria-label="Hidden face">?</div>'}</div><div class="grid">${WORDS.map(w=>`<button class="card ${state.guesses.includes(w)&&w!==state.secret?'bad':''} ${state.done&&w===state.secret?'good':''}" data-guess="${w}" ${state.done||state.guesses.includes(w)?'disabled':''}>${image(ASSETS[state.character+'Face'][w],state.character+' '+w)}<span class="label">${w}${state.guesses.includes(w)&&w!==state.secret?' ✕':''}${state.done&&w===state.secret?' ✓':''}</span></button>`).join('')}</div></div><div class="feedback" role="status" aria-live="polite">${feedback()}</div>${state.done?'<div class="center"><button class="primary" id="next">Next Round →</button></div>':''}`;document.querySelectorAll('[data-guess]').forEach(b=>b.onclick=()=>guess(b.dataset.guess));if($('next'))$('next').onclick=next;}
if(state.scores.some(s=>s>=3))winner();}
function feedback(){if(!state.last)return 'Say the question. Then tap!';const p=pronoun();if(state.last===state.secret)return `Yes, ${p} is! ⭐ Student ${guesser()+1} gets 1 point!`;if(state.done)return `No, ${p} isn’t. ${p==='he'?'He':'She'} is ${state.secret}.<br>No points this round. Let's switch turns!`;return `No, ${p} isn’t. Try again!`}
function handoff(){// Clear the secret grid before the guesser sees the screen.
$('screen').innerHTML='';save();$('modal').innerHTML=`<div class="overlay"><div class="dialog"><div class="big">🤫</div><h2>Secret is ready!</h2><p>Pass to Student ${guesser()+1}.</p><button class="primary" id="start">Start Guessing →</button></div></div>`;$('start').focus();$('start').onclick=()=>{tone('tap');$('modal').innerHTML='';state.page=3;render()}}
function guess(w){if(busy||state.done||state.guesses.includes(w)||state.page!==3)return;busy=true;state.last=w;state.guesses.push(w);if(w===state.secret){state.done=true;state.scores[guesser()]++;tone('correct')}else{state.hearts--;tone('wrong');if(!state.hearts){state.done=true}}render();if(!state.done){const card=document.querySelector(`[data-guess="${w}"]`);card?.classList.add('shake')}setTimeout(()=>{busy=false},400)}
function next(){if(!state.done||state.scores.some(s=>s>=3))return;tone('tap');state.picker=1-state.picker;state.page=1;state.character=null;state.secret=null;state.last=null;state.guesses=[];state.hearts=3;state.done=false;render()}
function reset(){state={scores:[0,0],picker:0,page:1,character:null,secret:null,guesses:[],hearts:3,done:false,last:null};busy=false;$('modal').innerHTML='';render()}
function winner(){const i=state.scores[0]>=3?0:1;$('modal').innerHTML=`<div class="overlay"><div class="dialog"><div class="big">🏆</div><h2>Student ${i+1} wins!</h2><p>Wonderful speaking!</p><p>Student 1: ${state.scores[0]} · Student 2: ${state.scores[1]}</p><button class="primary" id="again">Play Again</button></div></div>`;$('again').onclick=()=>{tone('tap');reset()};$('again').focus();tone('win');for(let n=0;n<35;n++){const el=document.createElement('span');el.className='confetti';el.textContent=['⭐','💜','🌟','💙'][n%4];el.style.left=Math.random()*100+'%';el.style.animationDelay=Math.random()*.5+'s';document.body.append(el);setTimeout(()=>el.remove(),3200)}}
$('sound').onclick=()=>{sound=!sound;tone('tap');save();$('sound').textContent=sound?'🔊 Sound on':'🔇 Sound off'};
$('restart').onclick=()=>{tone('tap');$('modal').innerHTML='<div class="overlay"><div class="dialog"><h2>Start a new game?</h2><p>Both scores will return to zero.</p><button class="primary" id="yes">Restart</button> <button class="primary" id="cancel">Keep Playing</button></div></div>';$('cancel').focus();$('yes').onclick=reset;$('cancel').onclick=()=>{$('modal').innerHTML='';if(state.page===2&&state.secret)handoff();else if(state.scores.some(s=>s>=3))winner()}};
render();if(state.page===2&&state.secret)handoff();
Object.values(ASSETS).forEach(group=>Object.values(group).forEach(url=>{const img=new Image();img.src=url}));
</script></body></html>
